trigger:
  branches:
    include:
      - dev
pr:
  branches:
    include:
      - dev
pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '11'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  - script: mvn test
    displayName: 'Build and run tests with Maven'
